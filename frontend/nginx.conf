server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1m, which rejects uploads like floor plan images
    # before they even reach the backend (matches the 10MB Kestrel limit
    # set on the office-floor-map upload endpoint).
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container over the internal Docker network
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The backend serves uploaded files (floor maps, and anything else added
    # later) from its own wwwroot via UseStaticFiles() at /uploads/. Proxy
    # it the same way as /api/, otherwise these URLs fall through to the
    # SPA's index.html instead of the actual file.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
