services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pps_license_manager
      POSTGRES_USER: pps_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # host 5432 is already taken by an existing Postgres install
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pps_admin -d pps_license_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/PPS.LicenseManager.API
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=pps_license_manager;Username=pps_admin;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: PPS.LicenseManager.API
      Jwt__Audience: PPS.LicenseManager.Client
      Jwt__ExpiryInMinutes: "60"
      # Base URL secure purchase-requisition approval links are built
      # from (e.g. "{this}/pr-approval/{token}") - defaults to this
      # deployment's current address, but can be overridden without a
      # code change via APP_PUBLIC_BASE_URL in .env if the domain changes.
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://98.93.56.145:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Uploaded files (floor maps, etc.) live in wwwroot on the container's
      # own filesystem. Without this, every rebuild wipes them out even
      # though the database still references the (now-missing) file.
      - backend_uploads:/app/wwwroot/uploads
      # Generated purchase requisition PDFs (Phase 6) - deliberately
      # outside wwwroot so they're never served as a static file, only
      # through the authenticated GET /api/PurchaseRequisition/{id}/pdf
      # endpoint. Needs its own volume for the same reason as
      # backend_uploads above - without it, a rebuild would wipe every
      # generated PDF even though PurchaseRequisitions.PdfPath still
      # points at it.
      - backend_pdfs:/app/App_Data

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  backend_uploads:
  backend_pdfs:
