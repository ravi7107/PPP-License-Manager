services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pps_license_manager
      POSTGRES_USER: pps_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # host 5432 is already taken by an existing Postgres install
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pps_admin -d pps_license_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/PPS.LicenseManager.API
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # This host has no functional outbound IPv6 route (confirmed via
      # `ip -6 route` showing no global/default route, and `curl -6` to
      # any internet host failing with "Network is unreachable" - Docker's
      # own bridge network agrees, EnableIPv6: false, no IPv6Address on any
      # container). DNS still returns AAAA records for external hosts
      # (e.g. graph.microsoft.com) regardless, and .NET's HttpClient can
      # pick one of those unreachable IPv6 addresses and fail outright
      # instead of reliably falling back to IPv4 - this happened live,
      # breaking a PR approval email send with "Network is unreachable
      # (graph.microsoft.com:443)" after dozens of prior sends had
      # succeeded. Disabling IPv6 at the runtime level stops .NET from
      # ever attempting it, matching what this host can actually route.
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=pps_license_manager;Username=pps_admin;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: PPS.LicenseManager.API
      Jwt__Audience: PPS.LicenseManager.Client
      Jwt__ExpiryInMinutes: "60"
      # Base URL secure purchase-requisition approval links are built
      # from (e.g. "{this}/pr-approval/{token}") - defaults to this
      # deployment's current address, but can be overridden without a
      # code change via APP_PUBLIC_BASE_URL in .env if the domain changes.
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://98.93.56.145:3000}
      # This API's own public address (not the frontend's) - used to build
      # vendor-quotation attachment links on the Finance verification
      # email/landing page. Override via APP_PUBLIC_API_BASE_URL in .env
      # if the domain changes.
      App__PublicApiBaseUrl: ${APP_PUBLIC_API_BASE_URL:-http://98.93.56.145:8080}
      # PR approval notification emails - two possible transports, both
      # deliberately OPTIONAL here (empty-string defaults, never :? - the
      # container must still start cleanly with neither filled in yet).
      # EmailServiceRouter picks whichever is actually configured at
      # runtime: GraphMail (Microsoft Graph, OAuth2) preferred if present,
      # else Smtp (Basic Auth) as a fallback, else every send just logs
      # instead of throwing. Real secrets belong only in .env (gitignored),
      # never hardcoded here.
      #
      # Microsoft Graph - the primary path, sending as the shared mailbox
      # approvals@ppspl.in via an Exchange Online Application Access
      # Policy scoped to that one address (see the deploy notes for the
      # exact PowerShell). Get TenantId/ClientId/ClientSecret from the
      # app registration's Overview + Certificates & secrets pages in
      # Entra admin center.
      GraphMail__TenantId: ${GRAPH_TENANT_ID:-}
      GraphMail__ClientId: ${GRAPH_CLIENT_ID:-}
      GraphMail__ClientSecret: ${GRAPH_CLIENT_SECRET:-}
      GraphMail__SenderAddress: ${GRAPH_SENDER_ADDRESS:-}
      # SMTP - kept as a working fallback (e.g. during any window before
      # Graph is fully set up, or if Graph ever needs troubleshooting).
      # Host/Port/EnableSsl default to Microsoft 365's SMTP AUTH client
      # submission endpoint since that's the provider in use.
      Smtp__Host: ${SMTP_HOST:-smtp.office365.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-PPS SmartAsset}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Uploaded files (floor maps, etc.) live in wwwroot on the container's
      # own filesystem. Without this, every rebuild wipes them out even
      # though the database still references the (now-missing) file.
      - backend_uploads:/app/wwwroot/uploads
      # Generated purchase requisition PDFs (Phase 6) - deliberately
      # outside wwwroot so they're never served as a static file, only
      # through the authenticated GET /api/PurchaseRequisition/{id}/pdf
      # endpoint. Needs its own volume for the same reason as
      # backend_uploads above - without it, a rebuild would wipe every
      # generated PDF even though PurchaseRequisitions.PdfPath still
      # points at it.
      - backend_pdfs:/app/App_Data

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Public HTTPS entry point for ppsl.net.in - terminates TLS with a
  # Let's Encrypt certificate it obtains and renews automatically, then
  # forwards everything to the frontend container's own nginx (which
  # already proxies /api/ and /uploads/ to the backend internally, so
  # Caddy only needs to know about one upstream). Requires a public DNS A
  # record for ppsl.net.in pointing at this server's public IP, and ports
  # 80/443 reaching this host (80 is needed for the ACME HTTP-01
  # challenge, not just as an HTTP->HTTPS redirect).
  #
  # This does not replace the existing frontend:3000/backend:8080 direct
  # ports above - they're left in place as a plain-HTTP fallback (e.g.
  # for local-network access without a working domain yet).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Alternative/fallback path to ppsl.net.in when no inbound port on this
  # network can be opened (CGNAT, ISP-side blocking, etc. - the situation
  # Caddy above needs 80/443 reachable from the internet for, which this
  # doesn't). cloudflared makes only an OUTBOUND connection to Cloudflare,
  # which then relays public traffic for ppsl.net.in back through that
  # connection - no router or ISP change needed, and Cloudflare manages
  # its own edge TLS certificate automatically.
  #
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env (from the tunnel you create
  # in the Cloudflare Zero Trust dashboard under Networks > Tunnels - see
  # deploy-cloudflare-tunnel.sh for the full setup walkthrough). The
  # tunnel's Public Hostname is configured in that same Cloudflare
  # dashboard, not here - point it at service http://frontend:80, the
  # same upstream Caddy uses.
  #
  # Both this and caddy can run at the same time without conflict - they
  # don't share ports, and only whichever one Cloudflare/DNS is actually
  # routing ppsl.net.in through is "live" from the outside at any given
  # moment.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env - see deploy-cloudflare-tunnel.sh}
    depends_on:
      - frontend

volumes:
  pgdata:
  backend_uploads:
  backend_pdfs:
  caddy_data:
  caddy_config:
